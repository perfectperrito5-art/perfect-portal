name: Portal checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/account-token-system]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app run.py
      - name: Smoke-test database bootstrap and portal rendering
        env:
          DATABASE_URL: sqlite:////tmp/perfect-portal-ci.db
          SECRET_KEY: ci-test-secret
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-test-password
          GATEWAY_ENABLED: "false"
          WTF_CSRF_ENABLED: "false"
        run: |
          python - <<'PY'
          from app import create_app
          from app.extensions import db
          from app.models.settings import SiteSetting
          from app.models.customer import CustomerAccount
          app = create_app()
          app.testing = True
          client = app.test_client()
          legacy = client.get("/")
          assert legacy.status_code == 200, legacy.status_code
          with app.app_context():
              SiteSetting.set("purchasing_mode", "tokens")
          token_page = client.get("/?mac=AA:BB:CC:DD:EE:FF")
          assert token_page.status_code == 200, token_page.status_code
          assert b"Available Tokens" in token_page.data
          assert b"Token Bundles" in token_page.data
          with app.app_context():
              assert CustomerAccount.query.count() == 1
          print("Legacy and token-mode portal rendering passed.")
          PY
