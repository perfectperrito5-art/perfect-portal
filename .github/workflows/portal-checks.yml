name: Portal checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/account-token-system]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile application
        run: python -m compileall -q app run.py
      - name: Smoke-test database bootstrap and portal rendering
        env:
          DATABASE_URL: sqlite:////tmp/perfect-portal-ci.db
          SECRET_KEY: ci-test-secret
          ADMIN_USERNAME: ci-admin
          ADMIN_PASSWORD: ci-test-password
          GATEWAY_ENABLED: "false"
          WTF_CSRF_ENABLED: "false"
        run: |
          python - <<'PY'
          from app import create_app
          app = create_app()
          app.testing = True
          response = app.test_client().get("/")
          assert response.status_code == 200, response.status_code
          print("Application bootstrap and portal render passed.")
          PY
