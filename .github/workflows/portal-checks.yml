name: Portal checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/account-token-system]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application
        run: python -m compileall -q app run.py
