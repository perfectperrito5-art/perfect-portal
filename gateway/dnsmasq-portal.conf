# Captive portal DHCP + DNS for Perfect Portal clients
interface=wlp1s0
bind-interfaces
domain-needed
bogus-priv
no-resolv
no-hosts
server=1.1.1.1
server=8.8.8.8
dhcp-range=10.10.0.50,10.10.0.200,255.255.255.0,12h
dhcp-option=3,10.10.0.1
dhcp-option=6,10.10.0.1
# Captive DNS: resolve everything to the portal until authorized clients use real DNS via NAT
address=/#/10.10.0.1
log-queries
log-dhcp